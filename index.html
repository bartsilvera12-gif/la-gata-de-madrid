<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="./catalogo.js"></script>
<style>
  body { margin:0; background:#FDFBF8; -webkit-font-smoothing:antialiased; }
  a { color:#A85E72; text-decoration:none; cursor:pointer; }
  a:hover { color:#5F6B47; }
  ::selection { background:#F0DCDF; color:#3A2B26; }
  input, select, button { font-family:'Jost',system-ui,sans-serif; }
  input:focus, select:focus { outline:none; border-color:#C08292; }
  html.lgm-reveal [data-reveal] { opacity:0; transform:translateY(18px); transition:opacity .5s ease, transform .5s cubic-bezier(.22,.7,.2,1); }
  html.lgm-reveal [data-reveal].is-in { opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){ [data-reveal]{ opacity:1 !important; transform:none !important; transition:none } }
  @keyframes lgm-in { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
  @keyframes lgm-blink { 0%,62%{ transform:scaleY(1) } 66%{ transform:scaleY(.08) } 70%,86%{ transform:scaleY(1) } 89%{ transform:scaleY(.08) } 93%,100%{ transform:scaleY(1) } }
  @keyframes lgm-fold { from { opacity:0; transform:rotateX(-92deg) } 60% { opacity:1 } to { opacity:1; transform:none } }
  @keyframes lgm-crease { from { opacity:.55 } to { opacity:0 } }
  .lgm-fold-seg { display:inline-block; perspective:700px; transform-style:preserve-3d; vertical-align:baseline }
  .lgm-fold-seg > span { position:relative; display:inline-block; transform-origin:50% 0%; transform-style:preserve-3d; backface-visibility:hidden; animation:lgm-fold .65s cubic-bezier(.2,.8,.2,1) both }
  .lgm-fold-seg > span::after { content:''; position:absolute; inset:-.08em -.02em; pointer-events:none; border-radius:.08em; mix-blend-mode:multiply; background:linear-gradient(180deg,rgba(0,0,0,.58) 0%,rgba(0,0,0,.22) 42%,rgba(255,255,255,.26) 100%); animation:lgm-crease .65s linear both; animation-delay:inherit }
  @media (prefers-reduced-motion: reduce){ .lgm-fold-seg > span, .lgm-fold-seg > span::after { animation:none !important; opacity:1 !important; transform:none !important } }
  @keyframes lgm-sway { 0%,100%{ transform:rotate(-6deg) } 50%{ transform:rotate(6deg) } }
  /* --- imagenes: animacion al pasar el cursor --- */
  .lgm-zoom { overflow:hidden }
  .lgm-zoom img { transition:transform .65s cubic-bezier(.22,.7,.2,1), filter .65s ease; will-change:transform; backface-visibility:hidden }
  .lgm-zoom:hover img, .lgm-zoom:focus-visible img { transform:scale(1.08); filter:saturate(1.06) }
  .lgm-lift { transition:transform .45s cubic-bezier(.22,.7,.2,1), box-shadow .45s ease }
  .lgm-lift:hover, .lgm-lift:focus-visible { transform:translateY(-6px); box-shadow:0 18px 38px -18px rgba(58,43,38,.45) }
  .lgm-veil { transition:opacity .45s ease }
  .lgm-cat:hover .lgm-veil { opacity:1 }
  .lgm-capt { transition:transform .45s cubic-bezier(.22,.7,.2,1) }
  .lgm-cat:hover .lgm-capt { transform:translateY(-5px) }
  @media (prefers-reduced-motion: reduce){
    .lgm-zoom img, .lgm-lift, .lgm-veil, .lgm-capt, .lgm-paw { transition:none !important; transform:none !important; filter:none !important }
  }

  /* --- desplegable de orden: reemplaza al <select> del sistema --- */
  .lgm-about-top { display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);
    gap:clamp(28px,4vw,56px); align-items:center }
  @media (max-width: 860px){ .lgm-about-top { grid-template-columns:minmax(0,1fr) !important } }

  .lgm-sort { position:relative; display:inline-block }
  .lgm-sort-btn { display:inline-flex; align-items:center; gap:9px; border:0; background:transparent;
    cursor:pointer; padding:9px 14px; border-radius:999px; font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:#3A2B26; white-space:nowrap; transition:background .2s ease }
  .lgm-sort-btn:hover, .lgm-sort-btn:focus-visible { background:#FAEDF1 }
  .lgm-sort-btn svg { display:block; flex:none; transition:transform .25s cubic-bezier(.22,.7,.2,1) }
  .lgm-sort[data-open="1"] .lgm-sort-btn { background:#FAEDF1 }
  .lgm-sort[data-open="1"] .lgm-sort-btn svg { transform:rotate(180deg) }
  .lgm-sort-panel { position:absolute; top:calc(100% + 10px); right:0; z-index:31; min-width:248px;
    max-width:calc(100vw - 40px); background:#FFFFFF; border:1px solid #EDDCD8; border-radius:14px;
    padding:6px; box-shadow:0 20px 46px -22px rgba(58,43,38,.5); animation:lgm-sort-in .18s ease both }
  @keyframes lgm-sort-in { from { opacity:0; transform:translateY(-6px) } to { opacity:1; transform:none } }
  .lgm-sort-opt { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
    text-align:left; border:0; background:transparent; cursor:pointer; padding:11px 14px; border-radius:10px;
    font-size:13.5px; color:#3A2B26; transition:background .16s ease }
  .lgm-sort-opt:hover, .lgm-sort-opt:focus-visible { background:#FAEDF1 }
  .lgm-sort-opt[aria-selected="true"] { color:#A8336B; font-weight:500 }
  .lgm-sort-tick { opacity:0; flex:none }
  .lgm-sort-opt[aria-selected="true"] .lgm-sort-tick { opacity:1 }
  @media (prefers-reduced-motion: reduce){
    .lgm-sort-panel { animation:none }
    .lgm-sort-btn svg { transition:none }
  }

  /* --- huella de gata: dibujo unico, usado en el menu y en la franja --- */
  .lgm-paw { display:inline-block; flex:none; line-height:0; width:19px;
    transition:transform .35s cubic-bezier(.22,.7,.2,1) }
  .lgm-paw svg { display:block; width:100%; height:auto }
  .lgm-paw-logo { width:23px }
  nav:hover .lgm-paw { transform:rotate(-10deg) scale(1.12) }

  /* --- huellitas de fondo: recorridos que se encienden una tras otra --- */
  .lgm-tracks { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden }
  .lgm-track-paw { position:absolute; display:block; color:#CE9FAD; opacity:0;
    animation-name:lgm-track; animation-timing-function:ease-in-out;
    animation-iteration-count:infinite; animation-fill-mode:both }
  .lgm-track-paw svg { display:block; width:100%; height:auto }
  @keyframes lgm-track {
    0%   { opacity:0;   scale:.7 }
    3%   { opacity:.24; scale:1 }
    28%  { opacity:.24; scale:1 }
    38%  { opacity:0;   scale:1 }
    100% { opacity:0;   scale:1 }
  }
  @media (prefers-reduced-motion: reduce){ .lgm-tracks { display:none } }

  /* --- adaptacion a celular --- */
  img, video { max-width:100% }
  @media (hover: none) {
    /* en pantallas tactiles el zoom se dispara al tocar: lo desactivamos */
    .lgm-zoom img { transform:none !important; filter:none !important }
    .lgm-lift:hover { transform:none !important; box-shadow:none !important }
  }
  @media (max-width: 860px){
    .lgm-shop { grid-template-columns:minmax(0,1fr) !important }
    .lgm-shopside { flex-direction:row !important; flex-wrap:nowrap !important; align-items:center !important;
      gap:10px !important; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; -webkit-overflow-scrolling:touch }
    .lgm-shopside::-webkit-scrollbar { display:none }
    .lgm-shopside > * { flex:none !important; white-space:nowrap }
    .lgm-shopside > p { margin:0 4px 0 0 !important }
    .lgm-shopside { padding:12px 14px !important; border-radius:14px !important }
    .lgm-shopside button { background:#FFFFFF !important; border:1px solid #E7C3CE !important; border-radius:999px !important; padding:9px 16px !important; font-size:14.5px !important }
    .lgm-pdp { grid-template-columns:minmax(0,1fr) !important }
    .lgm-head { padding:12px 20px !important; gap:8px 14px !important }
    .lgm-nav { order:3; flex:1 0 100% !important; justify-content:center !important; gap:14px !important }
  }
  @media (max-width: 720px){
    .lgm-track-paw { width:19px !important }
    .lgm-sec { padding-left:18px !important; padding-right:18px !important }
    .lgm-promo-in { padding-left:18px !important; padding-right:18px !important }
    .lgm-head { padding:10px 16px !important; gap:8px 12px !important }
    .lgm-brand .lgm-brand-txt { font-size:16px !important; letter-spacing:.05em !important }
    .lgm-nav { order:3; flex:1 0 100% !important; justify-content:space-between !important; gap:6px !important }
    .lgm-nav a { padding:6px 0 }
    .lgm-cart-btn { padding:9px 14px !important; font-size:11.5px !important; gap:8px !important }
    .lgm-hero { padding-left:18px !important; padding-right:18px !important }
    .lgm-band { padding-left:14px !important; padding-right:14px !important }
    .lgm-bandcat { width:clamp(210px,62vw,300px) !important; height:clamp(160px,46vw,230px) !important }
    .lgm-about { grid-template-columns:minmax(0,1fr) !important }
    .lgm-about .lgm-about-txt { padding:26px 20px 28px !important }
    .lgm-about-foto { min-height:clamp(280px,74vw,380px) !important }
    .lgm-foot-outer { padding:36px 18px 22px !important }
    .lgm-foot { grid-template-columns:minmax(0,1fr) !important; gap:24px !important }
    .lgm-footcat { justify-self:center !important; align-self:center !important; width:clamp(120px,38vw,180px) !important }
    .lgm-foot-legal { padding-left:18px !important; padding-right:18px !important }
    .lgm-pdp-thumb { width:66px !important; height:76px !important }
  }
  @media (max-width: 400px){
    .lgm-brand .lgm-brand-txt { font-size:14.5px !important }
    .lgm-nav { font-size:12px !important }
    .lgm-cart-btn { padding:9px 12px !important }
  }
</style>
</helmet>

  <header class="lgm-head" style="position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px 20px;flex-wrap:wrap;padding:14px 24px;background:rgba(253,251,248,.94);backdrop-filter:blur(8px);border-bottom:1px solid #EDDCD8">

    <nav class="lgm-nav" style="display:flex;align-items:center;flex-wrap:wrap;flex:1 1 260px;justify-content:center;min-width:0;gap:12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase">

      <span class="lgm-paw" role="img" aria-label="huella de gata" title="Huella de gata"><svg viewBox="0 0 64 64" focusable="false"><g fill="#BE7E93"><ellipse cx="32" cy="46.5" rx="17.5" ry="13.5"/><ellipse cx="11.5" cy="27" rx="6.4" ry="8.4" transform="rotate(-26 11.5 27)"/><ellipse cx="24.5" cy="16" rx="6.7" ry="9" transform="rotate(-9 24.5 16)"/><ellipse cx="39.5" cy="16" rx="6.7" ry="9" transform="rotate(9 39.5 16)"/><ellipse cx="52.5" cy="27" rx="6.4" ry="8.4" transform="rotate(26 52.5 27)"/></g></svg></span>

      <div>
        <img src="./assets/logo-gata-madrid.jpg" alt="La Gata de Madrid" style="display:block;width:100%;max-width:240px;height:auto;margin:0 0 16px;border-radius:12px;border:1px solid #E5D3CE">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240}}">
const h = React.createElement;
const ROSE = '#A85E72', INK = '#3A2B26', BODY = '#5A5350', OLIVE = '#5F6B47', LINE = '#EDDCD8', SOFT = '#FCEFF0';
// menu: negro; solo el apartado en el que estas parado va en rosa oscuro
const NAV = INK, NAV_ON = '#A8336B';
const serif = "'Cormorant Garamond',serif";

function parseHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  if (!raw) return { view: 'inicio' };
  const parts = raw.split('/');
  if (parts[0] === 'producto' && parts[1]) return { view: 'producto', id: decodeURIComponent(parts[1]) };
  if (parts[0] === 'productos') return { view: 'productos', cat: parts[1] ? decodeURIComponent(parts[1]) : null };
  if (parts[0] === 'nosotros') return { view: 'nosotros' };
  if (parts[0] === 'privacidad') return { view: 'privacidad' };
  if (parts[0] === 'carrito') return { view: 'productos', cart: true };
  return { view: 'inicio' };
}

class Component extends DCLogic {
  state = { route: { view: 'inicio' }, cart: {}, panel: null, cat: null, query: '', applied: '', sort: 'recientes', shot: 0, sortOpen: false };

  componentDidMount() {
    const L = window.LGM;
    const r = parseHash();
    this.setState({ route: r, cart: L ? L.readCart() : {}, panel: r.cart ? 'cart' : null });
    // El catálogo llega de Supabase un instante después: cuando está, se
    // vuelve a dibujar. Hasta entonces se ve el catálogo de respaldo.
    if (L) L.alCargar(() => { this.setState({ datos: (this.state.datos || 0) + 1 }); setTimeout(() => this.observeReveals(), 30); });
    this._onHash = () => {
      const next = parseHash();
      this.setState({ route: next, shot: 0, panel: next.cart ? 'cart' : null, cat: next.cat || null });
      window.scrollTo(0, 0);
    };
    window.addEventListener('hashchange', this._onHash);
    this._eyes = (e) => {
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      const clamp = (v) => Math.max(-1, Math.min(1, v));
      this.setState({
        eyeX: Math.round(clamp((e.clientX - cx) / (window.innerWidth * 0.34)) * 7),
        eyeY: Math.round(clamp((e.clientY - cy) / (window.innerHeight * 0.34)) * 5)
      });
    };
    window.addEventListener('mousemove', this._eyes, { passive: true });
    setTimeout(() => this.observeReveals(), 30);
  }

  componentWillUnmount() {
    window.removeEventListener('hashchange', this._onHash);
    window.removeEventListener('mousemove', this._eyes);
  }

  bindVideo(el) {
    if (!el) { this._video = null; return; }
    if (this._video === el) { this._kick(); return; }
    this._video = el;
    el.muted = true;
    el.defaultMuted = true;
    el.setAttribute('muted', '');
    el.setAttribute('playsinline', '');
    el.loop = true;
    this._kick = () => {
      const v = this._video;
      if (!v) return;
      v.muted = true;
      if (v.paused) {
        const p = v.play();
        if (p && p.catch) p.catch(() => {});
      }
    };
    ['loadeddata', 'canplay', 'canplaythrough', 'pause', 'stalled'].forEach(ev => el.addEventListener(ev, this._kick));
    if (!this._kickHooked) {
      this._kickHooked = true;
      ['pointerdown', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(ev =>
        window.addEventListener(ev, () => this._kick && this._kick(), { passive: true })
      );
      document.addEventListener('visibilitychange', () => this._kick && this._kick());
    }
    this._kick();
    [80, 400, 1200].forEach(ms => setTimeout(() => this._kick && this._kick(), ms));
  }

  // Dibujo unico de huella, en SVG: se lee nitido incluso a 16px.
  pawSvg(color) {
    return h('svg', { viewBox: '0 0 64 64', 'aria-hidden': 'true', focusable: 'false' },
      h('g', { fill: color }, [
        h('ellipse', { key: 'p', cx: 32, cy: 46.5, rx: 17.5, ry: 13.5 }),
        h('ellipse', { key: '1', cx: 11.5, cy: 27, rx: 6.4, ry: 8.4, transform: 'rotate(-26 11.5 27)' }),
        h('ellipse', { key: '2', cx: 24.5, cy: 16, rx: 6.7, ry: 9, transform: 'rotate(-9 24.5 16)' }),
        h('ellipse', { key: '3', cx: 39.5, cy: 16, rx: 6.7, ry: 9, transform: 'rotate(9 39.5 16)' }),
        h('ellipse', { key: '4', cx: 52.5, cy: 27, rx: 6.4, ry: 8.4, transform: 'rotate(26 52.5 27)' })
      ]));
  }

  benefitsStrip() {
    const items = [
      ['Envíos a todo el país', 'Coordinamos por WhatsApp'],
      ['Productos originales', 'Con caja y sellado de fábrica'],
      ['Stock corto', 'Pocas unidades de cada cosa'],
      ['Pago flexible', 'Transferencia, tarjeta o efectivo']
    ];
    const self = this;
    const cells = items.map(function (it) {
      return h('div', { key: it[0], style: { display: 'flex', gap: '12px', alignItems: 'flex-start' } }, [
        h('span', { key: 'p', style: { width: '19px', flex: 'none', marginTop: '2px', lineHeight: 0 } }, self.pawSvg('#BE7E93')),
        h('div', { key: 'd' }, [
          h('p', { key: 't', style: { margin: '0 0 3px', fontSize: '14.5px', color: INK } }, it[0]),
          h('p', { key: 'x', style: { margin: 0, fontSize: '13px', color: BODY } }, it[1])
        ])
      ]);
    });

    const inner = h('div', {
      style: { maxWidth: '1240px', margin: '0 auto', padding: '22px 28px', display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: '18px' }
    }, cells);

  catList(all) {
    // Cuántos productos y qué foto tiene cada categoría, según los productos.
    const map = {};
    all.forEach(p => {
      if (!map[p.cat]) map[p.cat] = { name: p.cat, count: 0, img: (p.gallery || [])[0] };
      map[p.cat].count++;
    });

    // Si hay categorías guardadas, mandan ellas: definen el orden y pueden
    // traer su propia foto. Las que no tienen ningún producto no se muestran,
    // para no dejar tarjetas vacías en la portada.
    const guardadas = window.LGM && window.LGM.categorias();
    if (guardadas && guardadas.length) {
      return guardadas
        .filter(c => map[c.nombre])
        .map(c => Object.assign({}, map[c.nombre], c.foto ? { img: c.foto } : {}));
    }
    return Object.keys(map).map(k => map[k]);

  // Huellitas de fondo. Cada recorrido enciende sus huellas una tras otra,
  // como si la gata cruzara la pantalla, y se apaga antes de volver a empezar.
  pawsLayer() {
    const TRACKS = [
      { k: 'a', x: 2.4, y: 88, dx: 1.4,  dy: -17, n: 5, rot: 8,   size: 28, start: 0,  off: 1.7 },
      { k: 'b', x: 92,  y: 12, dx: -1.2, dy: 19,  n: 4, rot: 188, size: 24, start: 10, off: -1.5 }
    ];
    const pawSvg = () => this.pawSvg('currentColor');
    const paws = [];
    TRACKS.forEach(t => {
      for (let i = 0; i < t.n; i++) {
        const side = i % 2 ? t.off : 0;
        paws.push(h('span', {
          key: t.k + i, className: 'lgm-track-paw',
          style: {
            left: (t.x + i * t.dx + side) + '%',
            top: (t.y + i * t.dy) + '%',
            width: t.size + 'px',
            transform: 'rotate(' + t.rot + 'deg)',
            animationDuration: '21s',
            animationDelay: (t.start + i * 0.4).toFixed(2) + 's'
          }
        }, pawSvg()));
      }
    });
    return h('div', { className: 'lgm-tracks', 'aria-hidden': 'true' }, paws);

  sweepReveals() {
    const nodes = document.querySelectorAll('[data-reveal]:not(.is-in)');
    const vh = window.innerHeight || 800;
    for (let i = 0; i < nodes.length; i++) {
      const r = nodes[i].getBoundingClientRect();
      if (r.top < vh * 0.94 && r.bottom > -vh * 0.2) nodes[i].classList.add('is-in');
    }
    return nodes.length;
  }

  observeReveals() {
    document.documentElement.classList.add('lgm-reveal');
    if (!this._sweepHooked) {
      this._sweepHooked = true;
      let queued = false;
      const run = () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; this.sweepReveals(); });
      };
      this._sweep = run;
      ['scroll', 'resize', 'wheel', 'touchmove'].forEach(ev =>
        window.addEventListener(ev, run, { passive: true })
      );
      document.addEventListener('scroll', run, { passive: true, capture: true });
      /* red de seguridad: si nada dispara, todo queda visible */
      this._sweepTimer = setInterval(() => {
        if (this.sweepReveals() === 0) { clearInterval(this._sweepTimer); this._sweepTimer = null; }
      }, 500);
      setTimeout(() => {
        const left = document.querySelectorAll('[data-reveal]:not(.is-in)');
        for (let i = 0; i < left.length; i++) left[i].classList.add('is-in');
      }, 9000);
    }
    this.sweepReveals();
    [60, 220, 600].forEach(ms => setTimeout(() => this.sweepReveals(), ms));
  }

          ? h('p', { style: { margin: 0, fontSize: '15.5px', lineHeight: 1.7, color: BODY } }, 'Tu carrito está vacío. Agregá productos y te los reservamos.')
          : lines.map(l => h('div', { key: l.p.id, style: { display: 'flex', gap: '14px', paddingBottom: '18px', borderBottom: '1px solid ' + LINE } }, [
              h('div', { key: 'i', style: { width: '76px', height: '86px', flex: 'none', overflow: 'hidden', background: SOFT } },
                h('img', {
                  src: (l.p.gallery || [])[0], alt: '',
                  style: { display: 'block', width: '100%', height: '100%', objectFit: 'cover' }
                })),
              h('div', { key: 'd', style: { flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: '6px' } }, [
                h('a', { key: 'n', onClick: () => { this.setState({ panel: null }); this.go('#/producto/' + l.p.id); }, style: { fontFamily: serif, fontSize: '19px', color: INK } }, l.p.name),
                h('p', { key: 'p', style: { margin: 0, fontSize: '14px', color: ROSE } }, L.gs(l.p.price)),
                h('div', { key: 'q', style: { display: 'flex', alignItems: 'center', gap: '10px' } }, [
                  h('button', { key: '-', type: 'button', onClick: () => this.setQty(l.p.id, l.qty - 1), style: qtyBtn }, '−'),
                  h('span', { key: 'v', style: { fontSize: '14.5px', minWidth: '18px', textAlign: 'center' } }, l.qty),
                  h('button', { key: '+', type: 'button', onClick: () => this.setQty(l.p.id, l.qty + 1), style: qtyBtn }, '+'),
                  h('button', { key: 'r', type: 'button', onClick: () => this.setQty(l.p.id, 0), style: { cursor: 'pointer', marginLeft: 'auto', border: 0, background: 'transparent', fontSize: '12px', letterSpacing: '.12em', textTransform: 'uppercase', color: '#7A6E6A' } }, 'Quitar')
                ])
              ])
            ]))),
      h('div', { key: 'f', style: { padding: '20px 24px 26px', borderTop: '1px solid ' + LINE, display: 'flex', flexDirection: 'column', gap: '14px' } }, [
        h('div', { key: 't', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' } }, [
          h('span', { key: 'l', style: { fontSize: '12.5px', letterSpacing: '.2em', textTransform: 'uppercase', color: OLIVE } }, 'Total'),
          h('span', { key: 'v', style: { fontFamily: serif, fontSize: '27px', color: INK } }, L.gs(total))
        ]),
        h('a', {
          key: 'c', href: lines.length ? 'https://wa.me/' + L.WA + '?text=' + waText : 'https://wa.me/' + L.WA,
          style: { textAlign: 'center', background: lines.length ? '#65734A' : '#C6C0B4', color: '#FFFFFF', padding: '15px 24px', borderRadius: '999px', fontSize: '12.5px', letterSpacing: '.16em', textTransform: 'uppercase', pointerEvents: lines.length ? 'auto' : 'none' }
        }, 'Finalizar pedido por WhatsApp')
      ])
    ]));
  }

  renderVals() {
    const L = window.LGM;
    const r = this.state.route;
    const view = r.view === 'productos' ? this.viewProductos()
      : r.view === 'producto' ? this.viewProducto(r.id)
      : r.view === 'nosotros' ? this.viewNosotros()
      : r.view === 'privacidad' ? this.viewPrivacidad()
      : this.viewInicio();
    const count = Object.keys(this.state.cart).reduce((s, k) => s + this.state.cart[k], 0);
    return {
      pawsEl: this.pawsLayer(),
      pieDescripcion: L ? L.cfg('pie_descripcion') : '',
      correo: L ? L.cfg('email') : '',
      correoHref: L ? 'mailto:' + L.cfg('email') : '#',
      waHref: L ? 'https://wa.me/' + L.WA : '#',
      waTexto: L ? '+' + String(L.WA).replace(/^(\d{3})(\d{3})(\d{3})(\d{3})$/, '$1 $2 $3 $4') : '',
      viewEl: window.LGM ? view : null,
      overlayEl: this.state.panel === 'cart' && window.LGM ? this.cartPanel() : null,
      cartCount: count,
      goHome: () => this.go('#/'),
      goProductos: () => this.go('#/productos'),
      goNosotros: () => this.go('#/nosotros'),
      goPrivacidad: () => this.go('#/privacidad'),
      openCart: () => this.setState({ panel: 'cart' }),
      inicioColor: r.view === 'inicio' ? NAV_ON : NAV,
      productosColor: (r.view === 'productos' || r.view === 'producto') ? NAV_ON : NAV,
      nosotrosColor: r.view === 'nosotros' ? NAV_ON : NAV
    };
  }
}
</script>
</body>
</html>
