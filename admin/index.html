<html>
<head>

<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · La Gata de Madrid</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* ---- Base ----
     Mismo lenguaje que la tienda: Cormorant para los títulos, Jost para la
     interfaz, y la paleta rosa/oliva sobre crema. ---- */
  :root {
    --tinta:#3A2B26; --texto:#5A5350; --tenue:#8C837E;
    --rosa:#A85E72; --rosa-f:#8E4258; --rosa-claro:#FCEFF0; --rosa-borde:#EFD9DE;
    --oliva:#65734A; --oliva-f:#4C5836; --oliva-claro:#EDF1E3;
    --linea:#EAE0D6; --papel:#FFFFFF; --fondo:#FBF7F2;
    --serif:'Cormorant Garamond',serif;
    --sombra:0 1px 2px rgba(58,43,38,.04), 0 8px 24px -16px rgba(58,43,38,.25);
    --sombra-alta:0 2px 4px rgba(58,43,38,.05), 0 18px 40px -22px rgba(58,43,38,.4);
  }

  body { margin:0; background:var(--fondo); color:var(--tinta);
    font-family:'Jost',system-ui,sans-serif; -webkit-font-smoothing:antialiased }
  a { color:var(--rosa); text-decoration:none }
  input, select, button, textarea { font-family:inherit }
  ::selection { background:var(--rosa-claro); color:var(--tinta) }
  :focus-visible { outline:2px solid var(--rosa); outline-offset:2px }

  /* ---- Cabecera ---- */
  .pn-top { position:sticky; top:0; z-index:20; display:flex; align-items:center;
    justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:16px 26px; background:rgba(251,247,242,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--linea) }
  .pn-marca { display:flex; align-items:center; gap:12px; min-width:0 }
  .pn-marca svg { display:block; width:26px; height:auto; flex:none }
  .pn-marca-txt { display:flex; flex-direction:column; gap:1px; min-width:0 }
  .pn-marca-txt b { font-family:var(--serif); font-weight:500; font-size:21px;
    letter-spacing:.06em; text-transform:uppercase; white-space:nowrap }
  .pn-marca-txt span { font-size:10.5px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--rosa) }
  .pn-top-acc { display:flex; align-items:center; gap:8px; flex-wrap:wrap }

  /* ---- Pestañas ---- */
  .pn-nav { border-bottom:1px solid var(--linea); background:var(--papel) }
  .pn-pestanas { display:flex; gap:4px; max-width:1180px; margin:0 auto; padding:0 26px;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch }
  .pn-pestanas::-webkit-scrollbar { display:none }
  .pn-pestanas > * { flex:none; white-space:nowrap }
  .pn-pestana { cursor:pointer; border:0; background:transparent; padding:15px 14px 13px;
    font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--tenue);
    border-bottom:2px solid transparent; transition:color .18s ease }
  .pn-pestana:hover { color:var(--tinta) }
  .pn-pestana[data-activa="1"] { color:var(--tinta); border-bottom-color:var(--rosa) }

  .pn-main { max-width:1180px; margin:0 auto; padding:clamp(22px,3vw,34px) 26px 90px }

  /* ---- Botones ---- */
  .pn-btn { cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    gap:8px; border:1px solid transparent; border-radius:999px; padding:12px 22px;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap;
    transition:background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease }
  .pn-btn:disabled { opacity:.45; cursor:default }
  .pn-btn:not(:disabled):active { transform:translateY(1px) }
  .pn-rosa { background:var(--rosa); color:#fff }
  .pn-rosa:hover:enabled { background:var(--rosa-f) }
  .pn-verde { background:var(--oliva); color:#fff }
  .pn-verde:hover:enabled { background:var(--oliva-f) }
  .pn-borde { background:var(--papel); color:var(--tinta); border-color:var(--linea) }
  .pn-borde:hover:enabled { border-color:var(--rosa); color:var(--rosa) }
  .pn-peligro { background:transparent; color:var(--rosa-f); border-color:var(--rosa-borde) }
  .pn-peligro:hover:enabled { background:var(--rosa-claro) }
  .pn-fantasma { background:transparent; color:var(--texto); border-color:transparent;
    padding:10px 14px; font-size:11.5px }
  .pn-fantasma:hover:enabled { color:var(--rosa); background:var(--rosa-claro) }

  /* ---- Campos ---- */
  .pn-campo { width:100%; box-sizing:border-box; border:1px solid var(--linea);
    border-radius:12px; background:var(--papel); padding:12px 14px; font-size:15px;
    color:var(--tinta); transition:border-color .18s ease, box-shadow .18s ease }
  .pn-campo:hover { border-color:#DFD2C6 }
  .pn-campo:focus { outline:none; border-color:var(--rosa); box-shadow:0 0 0 3px var(--rosa-claro) }
  textarea.pn-campo { resize:vertical; line-height:1.6 }
  .pn-etiqueta { font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--oliva); font-weight:500 }
  .pn-ayuda { font-size:12.5px; color:var(--tenue); line-height:1.5 }

  /* ---- Barra de búsqueda ---- */
  .pn-barra { display:flex; flex-wrap:wrap; gap:12px; align-items:center }
  .pn-controles { display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:1 1 320px;
    min-width:0; background:var(--papel); border:1px solid var(--linea);
    border-radius:999px; padding:5px 6px 5px 8px }
  .pn-buscar { position:relative; flex:1 1 190px; min-width:0 }
  .pn-buscar input { border:0; background:transparent; padding:9px 34px 9px 12px;
    border-radius:999px }
  .pn-buscar input:focus { box-shadow:none }
  .pn-limpiar { position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; border:0; border-radius:999px; background:#F1E8E0;
    color:var(--tenue); cursor:pointer; font-size:14px; line-height:1; padding:0 }
  .pn-limpiar:hover { background:var(--rosa-claro); color:var(--rosa-f) }
  .pn-filtro { flex:0 1 auto; border:0; background:#F7F1EA; border-radius:999px;
    padding:9px 14px; font-size:12.5px; letter-spacing:.06em; color:var(--tinta);
    cursor:pointer; max-width:190px }
  .pn-filtro:focus { box-shadow:none; border:0 }

  .pn-resumen { margin:0; font-size:13.5px; letter-spacing:.02em; color:var(--tenue) }

  /* ---- Tarjeta ---- */
  .pn-ficha { background:var(--papel); border:1px solid var(--linea); border-radius:18px;
    overflow:hidden; box-shadow:var(--sombra);
    transition:box-shadow .2s ease, border-color .2s ease }
  .pn-ficha:hover { box-shadow:var(--sombra-alta) }
  .pn-ficha[data-sucio="1"] { border-color:var(--rosa); box-shadow:0 0 0 3px var(--rosa-claro) }
  .pn-cab { cursor:pointer; display:flex; align-items:center; gap:16px; padding:14px 18px }
  .pn-cab:hover { background:#FEFBF8 }
  .pn-mini { width:58px; height:66px; flex:none; background:var(--rosa-claro);
    overflow:hidden; border-radius:12px; border:1px solid var(--rosa-borde) }
  .pn-mini img { display:block; width:100%; height:100%; object-fit:cover }
  .pn-nombre { margin:0 0 6px; font-family:var(--serif); font-weight:600; font-size:22px;
    line-height:1.15; color:var(--tinta) }
  .pn-meta { display:flex; flex-wrap:wrap; gap:7px; align-items:center;
    font-size:13px; color:var(--texto) }

  .pn-chip { display:inline-flex; align-items:center; gap:5px; font-size:10.5px;
    letter-spacing:.12em; text-transform:uppercase; padding:5px 11px; border-radius:999px;
    background:#F4EDE5; color:#786B64; border:1px solid transparent }
  .pn-chip[data-si="1"] { background:var(--oliva-claro); color:var(--oliva-f) }
  .pn-chip[data-alerta="1"] { background:var(--rosa-claro); color:var(--rosa-f);
    border-color:var(--rosa-borde) }

  .pn-mover { cursor:pointer; width:30px; height:25px; border:1px solid var(--linea);
    background:var(--papel); border-radius:9px; color:var(--tenue); font-size:11px;
    line-height:1; padding:0; transition:border-color .18s ease, color .18s ease }
  .pn-mover:hover:enabled { border-color:var(--rosa); color:var(--rosa) }
  .pn-mover:disabled { opacity:.3; cursor:default }

  .pn-cuerpo { border-top:1px solid #F3EAE1; padding:22px 18px 20px;
    display:flex; flex-direction:column; gap:22px; background:#FEFCFA }
  .pn-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px }
  .pn-grid-ancho { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px }
  .pn-pie-ficha { display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    border-top:1px solid #F3EAE1; padding-top:18px }

  .pn-foto { position:relative; width:78px; height:88px; border-radius:12px; overflow:hidden;
    border:1px solid var(--rosa-borde); background:var(--rosa-claro); flex:none }
  .pn-foto img { display:block; width:100%; height:100%; object-fit:cover }
  .pn-quitar { position:absolute; right:4px; top:4px; width:22px; height:22px;
    border-radius:999px; border:0; background:rgba(58,43,38,.7); color:#fff;
    font-size:13px; line-height:1; cursor:pointer }
  .pn-quitar:hover { background:var(--rosa-f) }
  .pn-subir { cursor:pointer; width:78px; height:88px; border-radius:12px;
    border:1px dashed #D3C4B6; display:flex; align-items:center; justify-content:center;
    flex:none; color:var(--tenue); font-size:24px; background:var(--papel);
    transition:border-color .18s ease, color .18s ease }
  .pn-subir:hover { border-color:var(--rosa); color:var(--rosa) }

  .pn-tilde { display:flex; align-items:center; gap:10px; font-size:14.5px; cursor:pointer;
    padding:10px 14px; border:1px solid var(--linea); border-radius:12px;
    background:var(--papel); transition:border-color .18s ease }
  .pn-tilde:hover { border-color:var(--rosa-borde) }
  .pn-tilde input { width:17px; height:17px; accent-color:var(--rosa); cursor:pointer }

  /* ---- Paginador ---- */
  .pn-pag { display:flex; align-items:center; justify-content:center; gap:14px;
    flex-wrap:wrap; padding-top:14px }
  .pn-pagbtn { cursor:pointer; border:1px solid var(--linea); background:var(--papel);
    color:var(--tinta); border-radius:999px; padding:10px 18px; font-size:11.5px;
    letter-spacing:.12em; text-transform:uppercase;
    transition:border-color .18s ease, color .18s ease }
  .pn-pagbtn:hover:enabled { border-color:var(--rosa); color:var(--rosa) }
  .pn-pagbtn:disabled { opacity:.35; cursor:default }

  /* ---- Aviso ---- */
  .pn-aviso { background:var(--oliva-claro); border-bottom:1px solid #DDE4C9; color:var(--oliva-f) }
  .pn-aviso p { max-width:1180px; margin:0 auto; padding:13px 26px; font-size:14px }

  /* ---- Sección (configuración) ---- */
  .pn-seccion { background:var(--papel); border:1px solid var(--linea); border-radius:18px;
    padding:26px; box-shadow:var(--sombra) }
  .pn-seccion h2 { margin:0 0 20px; font-family:var(--serif); font-weight:600; font-size:26px;
    color:var(--tinta) }

  /* ---- Acceso ---- */
  .pn-acceso { min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:
      radial-gradient(ellipse 70% 50% at 50% 0%, #FCEFF0 0%, transparent 70%), var(--fondo) }
  .pn-tarjeta { width:100%; max-width:390px; background:var(--papel);
    border:1px solid var(--linea); border-radius:24px; padding:clamp(28px,5vw,40px);
    display:flex; flex-direction:column; gap:16px; box-shadow:var(--sombra-alta) }
  .pn-tarjeta svg { display:block; width:38px; height:auto; margin:0 auto 4px }

  .pn-vacio { text-align:center; padding:50px 20px; color:var(--texto) }

  /* ---- Diálogo propio, en vez del cuadro gris del navegador ---- */
  .pn-velo { position:fixed; inset:0; z-index:60; display:flex; align-items:center;
    justify-content:center; padding:22px; background:rgba(58,43,38,.42);
    backdrop-filter:blur(3px); animation:pn-aparece .16s ease both }
  .pn-dialogo { width:100%; max-width:420px; background:var(--papel);
    border:1px solid var(--linea); border-radius:22px; padding:clamp(24px,4vw,30px);
    box-shadow:0 30px 70px -30px rgba(58,43,38,.6);
    display:flex; flex-direction:column; gap:14px; animation:pn-sube .2s cubic-bezier(.2,.8,.2,1) both }
  .pn-dialogo h2 { margin:0; font-family:var(--serif); font-weight:600; font-size:25px;
    line-height:1.15; color:var(--tinta) }
  .pn-dialogo p { margin:0; font-size:15px; line-height:1.65; color:var(--texto) }
  .pn-dialogo-acc { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;
    margin-top:4px }
  @keyframes pn-aparece { from { opacity:0 } to { opacity:1 } }
  @keyframes pn-sube { from { opacity:0; transform:translateY(12px) scale(.98) }
                       to { opacity:1; transform:none } }
  @media (prefers-reduced-motion: reduce){
    .pn-velo, .pn-dialogo { animation:none }
  }
  @media (max-width: 680px){
    .pn-dialogo-acc { flex-direction:column-reverse }
    .pn-dialogo-acc .pn-btn { width:100% }
  }

  @media (max-width: 680px){
    .pn-top { padding:13px 18px }
    .pn-pestanas, .pn-main { padding-left:18px; padding-right:18px }
    .pn-aviso p { padding-left:18px; padding-right:18px }
    .pn-cab { gap:12px; padding:13px 14px; flex-wrap:wrap }
    .pn-cuerpo { padding:18px 14px }
    .pn-seccion { padding:20px 16px }
    .pn-info { flex:1 1 100% !important }
    .pn-editar { flex:1 1 100% !important }
    .pn-cat-nom { flex:1 1 100% !important }
    .pn-cat-acc { flex:1 1 100% !important; justify-content:flex-end }
    .pn-controles { flex:1 1 100% }
    .pn-filtro { max-width:none; flex:1 1 100% }
  }
</style>
</helmet>

<div style="font-family:'Jost',system-ui,sans-serif;color:#3A2B26;background:#F7F3EE;min-height:100vh">
  {{ contenido }}
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120}}">
const h = React.createElement;

const API = 'https://api.neura.com.py';
const ESQUEMA = 'gatademadrid';
const CLAVE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzc0MTAxNDYxLCJleHAiOjE5MzE3ODE0NjF9.7_wAph8IolPMXtgfpezSwS5XR62IdD__qhqCywLDp3Q';

const sb = window.supabase.createClient(API, CLAVE, {
  db: { schema: ESQUEMA },
  auth: { persistSession: true, autoRefreshToken: true }
});

const INK = '#3A2B26', BODY = '#5A5350', OLIVE = '#6E7B53', SERIF = "'Cormorant Garamond',serif";
const gs = (n) => 'Gs. ' + Number(n || 0).toLocaleString('es-PY');

// La misma huella que usa la tienda, para que el panel se sienta del mismo sitio.
const huella = (color) => h('svg', { viewBox: '0 0 64 64', 'aria-hidden': 'true', focusable: 'false' },
  h('g', { fill: color || '#A85E72' }, [
    h('ellipse', { key: 'p', cx: 32, cy: 46.5, rx: 17.5, ry: 13.5 }),
    h('ellipse', { key: '1', cx: 11.5, cy: 27, rx: 6.4, ry: 8.4, transform: 'rotate(-26 11.5 27)' }),
    h('ellipse', { key: '2', cx: 24.5, cy: 16, rx: 6.7, ry: 9, transform: 'rotate(-9 24.5 16)' }),
    h('ellipse', { key: '3', cx: 39.5, cy: 16, rx: 6.7, ry: 9, transform: 'rotate(9 39.5 16)' }),
    h('ellipse', { key: '4', cx: 52.5, cy: 27, rx: 6.4, ry: 8.4, transform: 'rotate(26 52.5 27)' })
  ]));
const POR_PAGINA = 20;

// Las fotos viejas se guardaron como "./assets/x.jpg", que servía cuando todo
// colgaba de la raíz. El panel vive en /admin/, así que desde acá eso apunta a
// /admin/assets y no existe. Las que suba el panel son URLs completas.
function urlFoto(u) {
  const s = String(u || '');
  if (!s) return s;
  if (/^(https?:|data:|\/)/.test(s)) return s;  // absoluta: se usa tal cual
  return '../' + s.replace(/^\.\//, '');        // relativa: sube un nivel
}

// De "Clave: valor" por línea al formato [[clave, valor], ...] que guarda la base.
function fichaDesdeTexto(txt) {
  return String(txt || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(':');
    return i < 0 ? [l, ''] : [l.slice(0, i).trim(), l.slice(i + 1).trim()];
  });
}
function fichaATexto(ficha) {
  return (ficha || []).map(f => (f[0] || '') + ': ' + (f[1] || '')).join('\n');
}

// Un nombre convertido en identificador: "CK Eternity Moment" -> "ck-eternity-moment"
function aSlug(txt) {
  return String(txt || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'producto';
}

class Component extends DCLogic {
  state = {
    sesion: null, arrancando: true,
    pestana: 'productos',
    productos: [], config: [], categorias: [], conteos: {},
    total: 0, pagina: 1, busqueda: '', buscado: '', filtroCat: '',
    borrador: {}, cfgBorrador: {},
    abierto: null, aviso: '', trabajando: false,
    correo: '', clave: '', errorLogin: '',
    dialogo: null
  };

  componentDidMount() {
    sb.auth.getSession().then(({ data }) => this.verificar(data.session));
    sb.auth.onAuthStateChange((_e, sesion) => {
      if (!sesion) { this.setState({ sesion: null, arrancando: false }); return; }
      if (this.state.sesion) return;          // ya verificada
      this.verificar(sesion);
    });
  }

  // Tener cuenta en el Supabase no alcanza: la instancia es compartida con
  // otros proyectos. La base dice si este correo es administradora de la
  // tienda; si no lo es, se cierra la sesión acá mismo.
  verificar(sesion) {
    if (!sesion) { this.setState({ sesion: null, arrancando: false }); return; }
    sb.rpc('es_admin').then(({ data, error }) => {
      if (error || data !== true) {
        const correo = (sesion.user && sesion.user.email) || 'Esta cuenta';
        sb.auth.signOut();
        this.setState({
          sesion: null, arrancando: false, trabajando: false, clave: '',
          errorLogin: correo + ' no tiene permiso para entrar al panel.'
        });
        return;
      }
      this.setState({ sesion: sesion, arrancando: false, errorLogin: '' });
      this.cargar();
    });
  }

  // ---------- Diálogos ----------
  // Reemplazan a prompt() y confirm(), que cada navegador dibuja a su manera
  // y anuncian el dominio. Devuelven una promesa para que quien los llama se
  // lea igual de simple que antes.
  abrirDialogo(cfg) {
    return new Promise((resolver) => {
      this._enfocado = false;
      this.setState({ dialogo: Object.assign({ valor: '' }, cfg, { resolver: resolver }) });
    });
  }

  cerrarDialogo(resultado) {
    const d = this.state.dialogo;
    this.setState({ dialogo: null });
    if (d && d.resolver) d.resolver(resultado);
  }

  pedirTexto(cfg) {
    return this.abrirDialogo(Object.assign({ tipo: 'texto' }, cfg));
  }

  confirmar(cfg) {
    return this.abrirDialogo(Object.assign({ tipo: 'confirmar' }, cfg)).then(r => r === true);
  }

  vistaDialogo() {
    const d = this.state.dialogo;
    if (!d) return null;
    const aceptar = () => this.cerrarDialogo(d.tipo === 'texto' ? (d.valor || '') : true);
    const cancelar = () => this.cerrarDialogo(d.tipo === 'texto' ? null : false);

    return h('div', {
      key: 'velo', className: 'pn-velo', onClick: cancelar,
      onKeyDown: (e) => { if (e.key === 'Escape') { e.stopPropagation(); cancelar(); } }
    }, h('div', {
      className: 'pn-dialogo', role: 'dialog', 'aria-modal': 'true',
      onClick: (e) => e.stopPropagation()
    }, [
      h('h2', { key: 't' }, d.titulo),
      d.mensaje ? h('p', { key: 'm' }, d.mensaje) : null,
      d.tipo === 'texto' ? h('input', {
        key: 'i', className: 'pn-campo', type: 'text', value: d.valor || '',
        placeholder: d.placeholder || '',
        ref: (el) => {
          if (el && !this._enfocado) { this._enfocado = true; setTimeout(() => { el.focus(); el.select(); }, 30); }
        },
        onChange: (e) => this.setState({ dialogo: Object.assign({}, d, { valor: e.target.value }) }),
        onKeyDown: (e) => {
          if (e.key === 'Enter') { e.preventDefault(); aceptar(); }
          if (e.key === 'Escape') { e.preventDefault(); cancelar(); }
        }
      }) : null,
      h('div', { key: 'a', className: 'pn-dialogo-acc' }, [
        h('button', { key: 'c', type: 'button', className: 'pn-btn pn-borde', onClick: cancelar }, d.etiquetaCancelar || 'Cancelar'),
        h('button', {
          key: 'o', type: 'button',
          className: 'pn-btn ' + (d.peligro ? 'pn-peligro' : 'pn-rosa'),
          onClick: aceptar
        }, d.etiquetaOk || 'Aceptar')
      ])
    ]));
  }

  // ---------- Acceso ----------
  entrar(e) {
    if (e) e.preventDefault();
    const { correo, clave } = this.state;
    if (!correo || !clave) { this.setState({ errorLogin: 'Faltan el correo y la contraseña.' }); return; }
    this.setState({ trabajando: true, errorLogin: '' });
    sb.auth.signInWithPassword({ email: correo.trim(), password: clave }).then(({ data, error }) => {
      if (error) {
        this.setState({
          trabajando: false, clave: '',
          errorLogin: error.message === 'Invalid login credentials'
            ? 'Correo o contraseña incorrectos.' : error.message
        });
        return;
      }
      // La contraseña era correcta; ahora la base dice si tiene permiso.
      this.setState({ clave: '', trabajando: false });
      this.verificar(data.session);
    });
  }

  salir() { sb.auth.signOut().then(() => this.setState({ productos: [], config: [], borrador: {}, cfgBorrador: {} })); }

  // ---------- Datos ----------
  cargar() {
    this.setState({ trabajando: true });
    return Promise.all([
      sb.from('configuracion').select('*').order('orden', { ascending: true }),
      sb.from('categorias').select('*').order('orden', { ascending: true })
    ]).then(([cf, ct]) => {
      const config = cf.error ? [] : (cf.data || []);
      const cfgBorrador = {};
      config.forEach(c => { cfgBorrador[c.clave] = c.valor; });
      const categorias = ct.error ? [] : (ct.data || []);
      this.setState({
        config, cfgBorrador, categorias,
        aviso: cf.error ? 'Los productos cargaron. La configuración todavía no existe: falta correr 01-esquema.sql y 03-configuracion.sql.' : ''
      });
      this.contarPorCategoria(categorias);
      return this.cargarProductos({});
    }).catch(err => this.setState({ trabajando: false, aviso: 'No se pudo cargar: ' + err.message }));
  }

  // Trae solo la página que se está mirando. Con mil productos se piden
  // veinte, no mil: el filtrado y el conteo los hace la base.
  cargarProductos(op) {
    const pagina   = op.pagina   !== undefined ? op.pagina   : this.state.pagina;
    const buscado  = op.buscado  !== undefined ? op.buscado  : this.state.buscado;
    const filtroCat= op.filtroCat!== undefined ? op.filtroCat: this.state.filtroCat;
    const desde = (pagina - 1) * POR_PAGINA;

    let q = sb.from('productos').select('*', { count: 'exact' });
    if (buscado) {
      // Se limpian los caracteres que PostgREST usa como separadores, para
      // que lo que escriba la usuaria no rompa la consulta.
      const t = buscado.replace(/[,()%*\\]/g, ' ').trim();
      if (t) q = q.or('nombre.ilike.%' + t + '%,desc_corta.ilike.%' + t + '%,categoria.ilike.%' + t + '%');
    }
    if (filtroCat) q = q.eq('categoria', filtroCat);

    this.setState({ trabajando: true });
    return q.order('orden', { ascending: true }).order('creado', { ascending: true })
      .range(desde, desde + POR_PAGINA - 1)
      .then(({ data, count, error }) => {
        if (error) { this.setState({ trabajando: false, aviso: 'No se pudo cargar: ' + error.message }); return; }
        const productos = data || [];
        const borrador = {};
        productos.forEach(p => { borrador[p.id] = this.aBorrador(p); });
        this.setState({
          productos, borrador, pagina, buscado, filtroCat,
          total: count === null ? productos.length : count,
          trabajando: false
        });
      });
  }

  // Cuántos productos tiene cada categoría. Antes se contaba sobre la lista
  // cargada; con paginación esa lista ya no está entera en el navegador.
  contarPorCategoria(categorias) {
    if (!categorias.length) { this.setState({ conteos: {} }); return; }
    Promise.all(categorias.map(c =>
      sb.from('productos').select('id', { count: 'exact', head: true }).eq('categoria', c.nombre)
        .then(({ count }) => [c.nombre, count || 0])
    )).then(pares => {
      const conteos = {};
      pares.forEach(([n, c]) => { conteos[n] = c; });
      this.setState({ conteos });
    });
  }

  hayCambiosSinGuardar() {
    return this.state.productos.some(p => this.sucio(p.id));
  }

  // Cambiar de página o de filtro descarta lo que se esté editando, así que
  // primero se avisa.
  irA(cambios) {
    const seguir = () => {
      this.setState({ abierto: null, aviso: '' });
      this.cargarProductos(cambios);
    };
    if (!this.hayCambiosSinGuardar()) { seguir(); return; }
    this.confirmar({
      titulo: 'Tenés cambios sin guardar',
      mensaje: 'Si salís de esta página se pierden. ¿Seguir igual?',
      etiquetaOk: 'Seguir sin guardar', peligro: true
    }).then(ok => { if (ok) seguir(); });
  }

  aBorrador(p) {
    return {
      nombre: p.nombre || '', categoria: p.categoria || '', precio: p.precio || 0,
      badge: p.badge || '', desc_corta: p.desc_corta || '', desc_larga: p.desc_larga || '',
      fotos: (p.fotos || []).slice(), fichaTxt: fichaATexto(p.ficha),
      stock: p.stock || 0, destacado: !!p.destacado, oculto: !!p.oculto
    };
  }

  sucio(id) {
    const p = this.state.productos.find(x => x.id === id);
    const d = this.state.borrador[id];
    if (!p || !d) return false;
    return JSON.stringify(this.aBorrador(p)) !== JSON.stringify(d);
  }

  set(id, campo, valor) {
    const borrador = Object.assign({}, this.state.borrador);
    borrador[id] = Object.assign({}, borrador[id], { [campo]: valor });
    this.setState({ borrador, aviso: '' });
  }

  guardar(id) {
    const d = this.state.borrador[id];
    if (!d.nombre.trim()) { this.setState({ aviso: 'El producto necesita un nombre.' }); return; }
    this.setState({ trabajando: true });
    sb.from('productos').update({
      nombre: d.nombre.trim(), categoria: d.categoria.trim() || 'Sin categoría',
      precio: Number(d.precio) || 0, badge: d.badge.trim() || null,
      desc_corta: d.desc_corta, desc_larga: d.desc_larga,
      fotos: d.fotos, ficha: fichaDesdeTexto(d.fichaTxt),
      stock: Number(d.stock) || 0, destacado: !!d.destacado, oculto: !!d.oculto
    }).eq('id', id).select().then(({ data, error }) => {
      if (error) { this.setState({ trabajando: false, aviso: 'No se pudo guardar: ' + error.message }); return; }
      const productos = this.state.productos.map(p => p.id === id ? data[0] : p);
      this.setState({ productos, trabajando: false, aviso: 'Guardado ✓' });
      this.contarPorCategoria(this.state.categorias);
    });
  }

  nuevo() {
    const base = 'producto-' + Date.now().toString(36);
    // Va arriba de todo: un producto recien creado es el que hay que
    // completar, y no tiene sentido ir a buscarlo al final de la lista.
    // El orden puede ser negativo, asi cada nuevo queda por encima del
    // anterior sin tener que renumerar los demas.
    const ordenes = this.state.productos.map(p => p.orden || 0);
    const orden = (ordenes.length ? Math.min.apply(null, ordenes) : 10) - 10;
    this.setState({ trabajando: true });
    sb.from('productos').insert({
      id: base, nombre: 'Producto nuevo', categoria: 'Sin categoría',
      precio: 0, stock: 1, orden: orden, oculto: true
    }).select().then(({ data, error }) => {
      if (error) { this.setState({ trabajando: false, aviso: 'No se pudo crear: ' + error.message }); return; }
      const p = data[0];
      const borrador = Object.assign({}, this.state.borrador);
      borrador[p.id] = this.aBorrador(p);
      // Se limpian búsqueda y filtro y se vuelve a la primera página: si no,
      // el producto recién creado podría no entrar en lo que se está viendo.
      this.setState({
        productos: [p].concat(this.state.productos).slice(0, POR_PAGINA), borrador,
        abierto: p.id, trabajando: false, pagina: 1, busqueda: '', buscado: '', filtroCat: '',
        total: this.state.total + 1,
        aviso: 'Producto creado, oculto por ahora. Completalo y destildá "Ocultar" para publicarlo.'
      });
    });
  }

  borrar(id, nombre) {
    this.confirmar({
      titulo: '¿Borrar este producto?',
      mensaje: '"' + nombre + '" se va a borrar de la tienda. Esto no se puede deshacer.',
      etiquetaOk: 'Sí, borrar', peligro: true
    }).then(ok => { if (ok) this.borrarConfirmado(id); });
  }

  borrarConfirmado(id) {
    this.setState({ trabajando: true });
    sb.from('productos').delete().eq('id', id).then(({ error }) => {
      if (error) { this.setState({ trabajando: false, aviso: 'No se pudo borrar: ' + error.message }); return; }
      this.setState({
        productos: this.state.productos.filter(p => p.id !== id),
        total: Math.max(0, this.state.total - 1),
        abierto: null, trabajando: false, aviso: 'Producto borrado.'
      });
      this.contarPorCategoria(this.state.categorias);
    });
  }

  // Intercambia el orden con el vecino y guarda los dos.
  mover(id, paso) {
    const lista = this.state.productos.slice();
    const i = lista.findIndex(p => p.id === id);
    const j = i + paso;
    if (i < 0 || j < 0 || j >= lista.length) return;
    const a = lista[i], b = lista[j];
    const ordenA = a.orden, ordenB = b.orden;
    lista[i] = Object.assign({}, b, { orden: ordenA });
    lista[j] = Object.assign({}, a, { orden: ordenB });
    lista.sort((x, y) => x.orden - y.orden);
    this.setState({ productos: lista, trabajando: true });
    Promise.all([
      sb.from('productos').update({ orden: ordenB }).eq('id', a.id),
      sb.from('productos').update({ orden: ordenA }).eq('id', b.id)
    ]).then(() => this.setState({ trabajando: false, aviso: 'Orden actualizado ✓' }));
  }

  // ---------- Categorías ----------
  nuevaCategoria() {
    this.pedirTexto({
      titulo: 'Nueva categoría',
      mensaje: 'Así va a aparecer en la tienda.',
      placeholder: 'Ej: Maquillaje',
      etiquetaOk: 'Crear'
    }).then(txt => {
      const nombre = (txt || '').trim();
      if (!nombre) return;
      if (this.state.categorias.some(c => c.nombre.toLowerCase() === nombre.toLowerCase())) {
        this.setState({ aviso: 'Ya existe una categoría llamada "' + nombre + '".' });
        return;
      }
      this.crearCategoria(nombre);
    });
  }

  crearCategoria(nombre) {
    const orden = Math.max(0, ...this.state.categorias.map(c => c.orden || 0)) + 10;
    this.setState({ trabajando: true });
    sb.from('categorias').insert({ nombre: nombre, orden: orden }).select().then(({ data, error }) => {
      if (error) { this.setState({ trabajando: false, aviso: 'No se pudo crear: ' + error.message }); return; }
      this.setState({
        categorias: this.state.categorias.concat(data), trabajando: false,
        aviso: 'Categoría "' + nombre + '" creada.'
      });
    });
  }

  renombrarCategoria(vieja) {
    this.pedirTexto({
      titulo: 'Renombrar categoría',
      mensaje: 'Se actualizan también todos los productos que la usan.',
      valor: vieja, etiquetaOk: 'Renombrar'
    }).then(txt => {
      const nueva = (txt || '').trim();
      if (!nueva || nueva === vieja) return;
      this.renombrarConfirmado(vieja, nueva);
    });
  }

  renombrarConfirmado(vieja, nueva) {
    this.setState({ trabajando: true });
    // Una sola llamada: renombra la categoría y todos sus productos a la vez.
    sb.rpc('renombrar_categoria', { vieja: vieja, nueva: nueva }).then(({ error }) => {
      if (error) { this.setState({ trabajando: false, aviso: 'No se pudo renombrar: ' + error.message }); return; }
      this.setState({ aviso: 'Renombrada a "' + nueva + '". Se actualizaron los productos.' });
      this.cargar();
    });
  }

  cuantosUsan(nombre) {
    const n = this.state.conteos[nombre];
    return n === undefined ? 0 : n;
  }

  borrarCategoria(nombre) {
    const n = this.cuantosUsan(nombre);
    if (n) {
      this.setState({ aviso: 'No se puede borrar "' + nombre + '": la usan ' + n + ' producto(s). Cambiales la categoría primero.' });
      return;
    }
    this.confirmar({
      titulo: '¿Borrar la categoría?',
      mensaje: '"' + nombre + '" no tiene productos, así que se puede borrar sin afectar la tienda.',
      etiquetaOk: 'Sí, borrar', peligro: true
    }).then(ok => { if (ok) this.borrarCategoriaConfirmada(nombre); });
  }

  borrarCategoriaConfirmada(nombre) {
    this.setState({ trabajando: true });
    sb.from('categorias').delete().eq('nombre', nombre).then(({ error }) => {
      if (error) { this.setState({ trabajando: false, aviso: 'No se pudo borrar: ' + error.message }); return; }
      this.setState({
        categorias: this.state.categorias.filter(c => c.nombre !== nombre),
        trabajando: false, aviso: 'Categoría borrada.'
      });
    });
  }

  moverCategoria(nombre, paso) {
    const lista = this.state.categorias.slice();
    const i = lista.findIndex(c => c.nombre === nombre);
    const j = i + paso;
    if (i < 0 || j < 0 || j >= lista.length) return;
    const a = lista[i], b = lista[j];
    lista[i] = Object.assign({}, b, { orden: a.orden });
    lista[j] = Object.assign({}, a, { orden: b.orden });
    lista.sort((x, y) => x.orden - y.orden);
    this.setState({ categorias: lista, trabajando: true });
    Promise.all([
      sb.from('categorias').update({ orden: b.orden }).eq('nombre', a.nombre),
      sb.from('categorias').update({ orden: a.orden }).eq('nombre', b.nombre)
    ]).then(() => this.setState({ trabajando: false, aviso: 'Orden actualizado ✓' }));
  }

  // ---------- Fotos ----------
  subirFotos(id, archivos) {
    const lista = Array.from(archivos || []);
    if (!lista.length) return;
    this.setState({ trabajando: true, aviso: 'Subiendo ' + lista.length + ' foto(s)…' });
    const subir = (f) => {
      const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
      const ruta = id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
      return sb.storage.from('fotos').upload(ruta, f, { cacheControl: '31536000', upsert: false })
        .then(({ error }) => {
          if (error) throw error;
          return sb.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
        });
    };
    Promise.all(lista.map(subir)).then(urls => {
      const d = this.state.borrador[id];
      this.set(id, 'fotos', d.fotos.concat(urls));
      this.setState({ trabajando: false, aviso: 'Fotos subidas. Acordate de Guardar.' });
    }).catch(err => this.setState({ trabajando: false, aviso: 'No se pudieron subir: ' + err.message }));
  }

  quitarFoto(id, url) {
    const d = this.state.borrador[id];
    this.set(id, 'fotos', d.fotos.filter(u => u !== url));
  }

  // ---------- Configuración ----------
  guardarConfig() {
    const cambios = this.state.config.filter(c => this.state.cfgBorrador[c.clave] !== c.valor);
    if (!cambios.length) { this.setState({ aviso: 'No hay cambios en la configuración.' }); return; }
    this.setState({ trabajando: true });
    Promise.all(cambios.map(c =>
      sb.from('configuracion').update({ valor: this.state.cfgBorrador[c.clave] }).eq('clave', c.clave)
    )).then(res => {
      const err = res.find(r => r.error);
      if (err) { this.setState({ trabajando: false, aviso: 'No se pudo guardar: ' + err.error.message }); return; }
      const config = this.state.config.map(c => Object.assign({}, c, { valor: this.state.cfgBorrador[c.clave] }));
      this.setState({ config, trabajando: false, aviso: cambios.length + ' ajuste(s) guardado(s) ✓' });
    });
  }

  // Las categorías guardadas, más la del producto si quedó fuera de la lista
  // (por ejemplo si la categoría se borró después).
  opcionesCategoria(actual) {
    const nombres = this.state.categorias.map(c => c.nombre);
    if (actual && !nombres.includes(actual)) nombres.unshift(actual);
    if (!nombres.length) nombres.push('Sin categoría');
    return nombres.map(n => h('option', { key: n, value: n }, n));
  }

  // ---------- Piezas visuales ----------
  campo(etiqueta, ayuda, control) {
    return h('label', { style: { display: 'flex', flexDirection: 'column', gap: '7px', minWidth: 0 } }, [
      h('span', { key: 'e', className: 'pn-etiqueta' }, etiqueta),
      control,
      ayuda ? h('span', { key: 'a', className: 'pn-ayuda' }, ayuda) : null
    ]);
  }

  chip(texto, activo, alerta) {
    return h('span', { className: 'pn-chip', 'data-si': activo ? '1' : '0', 'data-alerta': alerta ? '1' : '0' }, texto);
  }

  fila(p, i, total) {
    const d = this.state.borrador[p.id];
    if (!d) return null;
    const abierto = this.state.abierto === p.id;
    const sucio = this.sucio(p.id);
    const t = this.state.trabajando;

    const cabecera = h('div', { key: 'cab', className: 'pn-cab', onClick: () => this.setState({ abierto: abierto ? null : p.id }) }, [
      this.state.buscado || this.state.filtroCat ? null :
      h('div', { key: 'ord', onClick: (e) => e.stopPropagation(), style: { display: 'flex', flexDirection: 'column', gap: '3px', flex: 'none' } }, [
        h('button', { key: 'u', type: 'button', className: 'pn-mover', disabled: (i === 0 && this.state.pagina === 1) || t, title: 'Subir', onClick: () => this.mover(p.id, -1) }, '▲'),
        h('button', { key: 'd', type: 'button', className: 'pn-mover', disabled: (i === total - 1 && this.state.pagina * POR_PAGINA >= this.state.total) || t, title: 'Bajar', onClick: () => this.mover(p.id, 1) }, '▼')
      ]),
      h('div', { key: 'm', className: 'pn-mini' }, d.fotos[0] ? h('img', { src: urlFoto(d.fotos[0]), alt: '' }) : null),
      h('div', { key: 'i', className: 'pn-info', style: { flex: 1, minWidth: 0 } }, [
        h('p', { key: 'n', className: 'pn-nombre' }, d.nombre || '(sin nombre)'),
        h('div', { key: 'c', className: 'pn-meta' }, [
          h('span', { key: 'p', style: { marginRight: '3px' } }, [
            d.categoria,
            h('span', { key: 's', style: { color: '#C9BCB4', margin: '0 6px' } }, '·'),
            h('b', { key: 'g', style: { fontWeight: 500, color: '#A85E72' } }, gs(d.precio))
          ]),
          this.chip('Stock ' + d.stock, d.stock > 0, d.stock <= 0),
          d.destacado ? this.chip('Destacado', true) : null,
          d.oculto ? this.chip('Oculto', false, true) : null,
          sucio ? this.chip('Sin guardar', false, true) : null
        ])
      ]),
      h('span', { key: 'x', className: 'pn-btn pn-borde pn-editar', style: { flex: 'none' } },
        abierto ? 'Cerrar' : 'Editar')
    ]);

    if (!abierto) return h('article', { key: p.id, className: 'pn-ficha', 'data-sucio': sucio ? '1' : '0' }, [cabecera]);

    const inp = (campo, tipo) => h('input', {
      className: 'pn-campo', type: tipo || 'text', value: d[campo],
      onChange: (e) => this.set(p.id, campo, tipo === 'number' ? e.target.value : e.target.value)
    });
    const area = (campo, filas) => h('textarea', {
      className: 'pn-campo', rows: filas || 3, value: d[campo],
      onChange: (e) => this.set(p.id, campo, e.target.value)
    });
    const tilde = (campo, etiqueta) => h('label', { className: 'pn-tilde' }, [
      h('input', { key: 'c', type: 'checkbox', checked: !!d[campo], onChange: (e) => this.set(p.id, campo, e.target.checked) }),
      h('span', { key: 's' }, etiqueta)
    ]);

    return h('article', { key: p.id, className: 'pn-ficha', 'data-sucio': sucio ? '1' : '0' }, [
      cabecera,
      h('div', { key: 'cuerpo', className: 'pn-cuerpo' }, [

        h('div', { key: 'g1', className: 'pn-grid' }, [
          this.campo('Nombre', '', inp('nombre')),
          this.campo('Categoría', 'Se administran en la pestaña Categorías.',
            h('select', {
              className: 'pn-campo', value: d.categoria,
              onChange: (e) => this.set(p.id, 'categoria', e.target.value)
            }, this.opcionesCategoria(d.categoria))),
          this.campo('Precio en guaraníes', 'Solo números.', inp('precio', 'number')),
          this.campo('Stock', 'En cero se muestra como agotado.', inp('stock', 'number')),
          this.campo('Etiqueta', 'Nuevo, Destacado, o vacío.', inp('badge'))
        ]),

        h('div', { key: 'g2', style: { display: 'flex', flexWrap: 'wrap', gap: '10px' } }, [
          tilde('destacado', 'Mostrar en "Lo que más se busca"'),
          tilde('oculto', 'Ocultar de la tienda')
        ]),

        h('div', { key: 'g3', className: 'pn-grid-ancho' }, [
          this.campo('Descripción corta', 'La línea que se ve en el listado.', area('desc_corta', 2)),
          this.campo('Descripción larga', 'El texto de la página del producto.', area('desc_larga', 4)),
          this.campo('Ficha técnica', 'Un dato por línea, con dos puntos. Ej: Batería: 36 h', area('fichaTxt', 4))
        ]),

        h('div', { key: 'fotos' }, [
          h('p', { key: 'e', className: 'pn-etiqueta', style: { margin: '0 0 10px' } }, 'Fotos'),
          h('div', { key: 'l', style: { display: 'flex', flexWrap: 'wrap', gap: '10px', alignItems: 'center' } },
            d.fotos.map(u => h('div', { key: u, className: 'pn-foto' }, [
              h('img', { key: 'i', src: urlFoto(u), alt: '' }),
              h('button', { key: 'x', type: 'button', className: 'pn-quitar', title: 'Quitar', onClick: () => this.quitarFoto(p.id, u) }, '×')
            ])).concat([
              h('label', { key: 'add', className: 'pn-subir' }, [
                h('input', { key: 'f', type: 'file', accept: 'image/*', multiple: true, style: { display: 'none' }, onChange: (e) => { this.subirFotos(p.id, e.target.files); e.target.value = ''; } }),
                h('span', { key: 's' }, '+')
              ])
            ])),
          h('p', { key: 'a', className: 'pn-ayuda', style: { margin: '10px 0 0' } }, 'La primera foto es la que se ve en el listado.')
        ]),

        h('div', { key: 'acc', className: 'pn-pie-ficha' }, [
          h('button', { key: 'g', type: 'button', className: 'pn-btn pn-verde', disabled: t || !sucio, onClick: () => this.guardar(p.id) }, sucio ? 'Guardar cambios' : 'Sin cambios'),
          h('a', { key: 'v', href: '../index.html#/producto/' + p.id, target: '_blank', rel: 'noopener', className: 'pn-btn pn-borde' }, 'Ver en la tienda'),
          h('span', { key: 'sp', style: { flex: 1 } }),
          h('button', { key: 'b', type: 'button', className: 'pn-btn pn-peligro', disabled: t, onClick: () => this.borrar(p.id, d.nombre) }, 'Borrar')
        ])
      ])
    ]);
  }

  vistaProductos() {
    const { productos, total, pagina, busqueda, buscado, filtroCat, trabajando } = this.state;
    const paginas = Math.max(1, Math.ceil(total / POR_PAGINA));
    const desde = total ? (pagina - 1) * POR_PAGINA + 1 : 0;
    const hasta = Math.min(pagina * POR_PAGINA, total);
    const filtrando = !!(buscado || filtroCat);

    const buscar = h('div', { key: 'b', className: 'pn-buscar' }, [
      h('input', {
        key: 'i', className: 'pn-campo', type: 'search', placeholder: 'Buscar producto…',
        value: busqueda,
        onChange: (e) => {
          const v = e.target.value;
          this.setState({ busqueda: v });
          // Se espera a que deje de escribir, para no consultar por cada tecla.
          clearTimeout(this._tBuscar);
          this._tBuscar = setTimeout(() => this.irA({ buscado: v, pagina: 1 }), 350);
        },
        onKeyDown: (e) => {
          if (e.key === 'Enter') { clearTimeout(this._tBuscar); this.irA({ buscado: busqueda, pagina: 1 }); }
        }
      }),
      busqueda ? h('button', {
        key: 'x', type: 'button', className: 'pn-limpiar', title: 'Limpiar',
        onClick: () => { clearTimeout(this._tBuscar); this.setState({ busqueda: '' }); this.irA({ buscado: '', pagina: 1 }); }
      }, '×') : null
    ]);

    const filtro = h('select', {
      key: 'f', className: 'pn-filtro',
      value: filtroCat,
      onChange: (e) => this.irA({ filtroCat: e.target.value, pagina: 1 })
    }, [h('option', { key: '', value: '' }, 'Todas las categorías')]
      .concat(this.state.categorias.map(c => h('option', { key: c.nombre, value: c.nombre }, c.nombre))));

    const resumen = total === 0
      ? (filtrando ? 'Ningún producto coincide' : 'Todavía no hay productos')
      : (total <= POR_PAGINA
        ? total + (total === 1 ? ' producto' : ' productos')
        : desde + '–' + hasta + ' de ' + total + ' productos');

    const paginador = paginas > 1 ? h('div', { key: 'pag', className: 'pn-pag' }, [
      h('button', { key: 'a', type: 'button', className: 'pn-pagbtn', disabled: pagina <= 1 || trabajando, onClick: () => this.irA({ pagina: pagina - 1 }) }, '← Anterior'),
      h('span', { key: 'n', style: { fontSize: '14px', color: BODY } }, 'Página ' + pagina + ' de ' + paginas),
      h('button', { key: 's', type: 'button', className: 'pn-pagbtn', disabled: pagina >= paginas || trabajando, onClick: () => this.irA({ pagina: pagina + 1 }) }, 'Siguiente →')
    ]) : null;

    return h('div', { key: 'prod', style: { display: 'flex', flexDirection: 'column', gap: '13px' } }, [
      h('div', { key: 'top', className: 'pn-barra' }, [
        h('button', { key: 'n', type: 'button', className: 'pn-btn pn-rosa', disabled: trabajando, onClick: () => this.nuevo() }, '+ Agregar producto'),
        h('div', { key: 'c', className: 'pn-controles' }, [buscar, filtro])
      ]),
      h('p', { key: 'r', className: 'pn-resumen' }, resumen),
      filtrando ? h('p', { key: 'av', className: 'pn-ayuda', style: { margin: 0 } },
        'Con un filtro activo las flechas de orden no se muestran: el orden se cambia sobre la lista completa.') : null
    ].concat(productos.length
      ? productos.map((p, i) => this.fila(p, i, productos.length))
      : []
    ).concat([paginador]));
  }

  vistaCategorias() {
    const { categorias, trabajando } = this.state;
    const t = trabajando;

    if (!categorias.length) {
      return h('div', { key: 'vac', style: { display: 'flex', flexDirection: 'column', gap: '14px', alignItems: 'flex-start' } }, [
        h('p', { key: 'p', style: { margin: 0, fontSize: '15.5px', lineHeight: 1.7, color: BODY, maxWidth: '62ch' } },
          'Todavía no hay categorías guardadas. Si ya corriste 04-categorias.sql, las que usan tus productos deberían aparecer acá; si no, creá la primera.'),
        h('button', { key: 'n', type: 'button', className: 'pn-btn pn-rosa', disabled: t, onClick: () => this.nuevaCategoria() }, '+ Nueva categoría')
      ]);
    }

    return h('div', { key: 'cat', style: { display: 'flex', flexDirection: 'column', gap: '13px' } }, [
      h('div', { key: 'top', className: 'pn-barra' }, [
        h('button', { key: 'n', type: 'button', className: 'pn-btn pn-rosa', disabled: t, onClick: () => this.nuevaCategoria() }, '+ Nueva categoría'),
        h('span', { key: 'c', className: 'pn-resumen' },
          categorias.length + (categorias.length === 1 ? ' categoría' : ' categorías') + ' · el orden es el que se ve en la portada')
      ])
    ].concat(categorias.map((c, i) => {
      const usan = this.cuantosUsan(c.nombre);
      return h('article', { key: c.nombre, className: 'pn-ficha' },
        h('div', { className: 'pn-cab', style: { cursor: 'default' } }, [
          h('div', { key: 'o', style: { display: 'flex', flexDirection: 'column', gap: '3px', flex: 'none' } }, [
            h('button', { key: 'u', type: 'button', className: 'pn-mover', disabled: i === 0 || t, title: 'Subir', onClick: () => this.moverCategoria(c.nombre, -1) }, '▲'),
            h('button', { key: 'd', type: 'button', className: 'pn-mover', disabled: i === categorias.length - 1 || t, title: 'Bajar', onClick: () => this.moverCategoria(c.nombre, 1) }, '▼')
          ]),
          h('div', { key: 'i', className: 'pn-cat-nom', style: { flex: 1 } }, [
            h('p', { key: 'n', className: 'pn-nombre', style: { wordBreak: 'break-word' } }, c.nombre),
            h('span', { key: 'u', className: 'pn-chip', 'data-alerta': usan ? '0' : '1' },
              usan ? usan + (usan === 1 ? ' producto' : ' productos') : 'sin productos')
          ]),
          h('div', { key: 'acc', className: 'pn-cat-acc', style: { display: 'flex', gap: '8px', flex: 'none' } }, [
            h('button', { key: 'r', type: 'button', className: 'pn-btn pn-borde', disabled: t, onClick: () => this.renombrarCategoria(c.nombre) }, 'Renombrar'),
            h('button', { key: 'b', type: 'button', className: 'pn-btn pn-peligro', disabled: t, onClick: () => this.borrarCategoria(c.nombre) }, 'Borrar')
          ])
        ]));
    })));
  }

  vistaConfig() {
    const { config, cfgBorrador } = this.state;
    if (!config.length) {
      return h('p', { key: 'v', style: { margin: 0, fontSize: '15.5px', lineHeight: 1.7, color: BODY } },
        'La tabla de configuración todavía no existe. Corré 01-esquema.sql y 03-configuracion.sql en Supabase y recargá esta página.');
    }
    const grupos = [];
    config.forEach(c => { if (!grupos.includes(c.grupo)) grupos.push(c.grupo); });
    const cambios = config.filter(c => cfgBorrador[c.clave] !== c.valor).length;

    return h('div', { key: 'cfg', style: { display: 'flex', flexDirection: 'column', gap: '16px' } },
      grupos.map(g => h('section', { key: g, className: 'pn-seccion' }, [
        h('h2', { key: 't' }, g),
        h('div', { key: 'c', className: 'pn-grid-ancho' },
          config.filter(c => c.grupo === g).map(c => this.campo(
            c.etiqueta, c.ayuda,
            c.tipo === 'parrafo'
              ? h('textarea', { className: 'pn-campo', rows: 3, value: cfgBorrador[c.clave] || '', onChange: (e) => this.setState({ cfgBorrador: Object.assign({}, cfgBorrador, { [c.clave]: e.target.value }), aviso: '' }) })
              : h('input', { className: 'pn-campo', type: c.tipo === 'email' ? 'email' : (c.tipo === 'tel' ? 'tel' : 'text'), value: cfgBorrador[c.clave] || '', onChange: (e) => this.setState({ cfgBorrador: Object.assign({}, cfgBorrador, { [c.clave]: e.target.value }), aviso: '' }) })
          )))
      ])).concat([
        h('div', { key: 'acc', style: { display: 'flex', gap: '12px', alignItems: 'center' } }, [
          h('button', { key: 'g', type: 'button', className: 'pn-btn pn-verde', disabled: this.state.trabajando || !cambios, onClick: () => this.guardarConfig() },
            cambios ? 'Guardar ' + cambios + ' cambio(s)' : 'Sin cambios')
        ])
      ]));
  }

  vistaAcceso() {
    return h('div', { key: 'acceso', className: 'pn-acceso' },
      h('form', { onSubmit: (e) => this.entrar(e), className: 'pn-tarjeta' }, [
        huella('#A85E72'),
        h('h1', { key: 't', style: { margin: '0 0 2px', fontFamily: SERIF, fontWeight: 500, fontSize: '30px', lineHeight: 1.12, color: INK, textAlign: 'center' } }, 'La Gata de Madrid'),
        h('p', { key: 'e', style: { margin: '0 0 8px', fontSize: '11px', letterSpacing: '.24em', textTransform: 'uppercase', color: '#A85E72', textAlign: 'center' } }, 'Panel de administración'),
        this.campo('Correo', '', h('input', { className: 'pn-campo', type: 'email', autoComplete: 'username', value: this.state.correo, onChange: (e) => this.setState({ correo: e.target.value }) })),
        this.campo('Contraseña', '', h('input', { className: 'pn-campo', type: 'password', autoComplete: 'current-password', value: this.state.clave, onChange: (e) => this.setState({ clave: e.target.value }) })),
        this.state.errorLogin ? h('p', { key: 'err', style: { margin: 0, fontSize: '14px', color: '#8C475C' } }, this.state.errorLogin) : null,
        h('button', { key: 'b', type: 'submit', className: 'pn-btn pn-verde', disabled: this.state.trabajando, style: { marginTop: '4px' } }, this.state.trabajando ? 'Entrando…' : 'Entrar'),
        h('a', { key: 'v', href: '../index.html', style: { fontSize: '13px', textAlign: 'center', color: '#8C837E', marginTop: '2px' } }, 'Volver a la tienda')
      ]));
  }

  vistaPanel() {
    const { pestana, aviso, trabajando } = this.state;
    return h('div', { key: 'panel' }, [
      h('header', { key: 'h', className: 'pn-top' }, [
        h('div', { key: 'm', className: 'pn-marca' }, [
          huella('#A85E72'),
          h('span', { key: 't', className: 'pn-marca-txt' }, [
            h('b', { key: 'n' }, 'La Gata de Madrid'),
            h('span', { key: 'p' }, 'Panel')
          ])
        ]),
        h('div', { key: 'a', className: 'pn-top-acc' }, [
          h('a', { key: 'v', href: '../index.html', target: '_blank', rel: 'noopener', className: 'pn-btn pn-fantasma' }, 'Ver tienda ↗'),
          h('button', { key: 's', type: 'button', className: 'pn-btn pn-borde', onClick: () => this.salir() }, 'Salir')
        ])
      ]),

      h('div', { key: 'nav', className: 'pn-nav' },
        h('div', { className: 'pn-pestanas' }, [
          h('button', { key: 'p', type: 'button', className: 'pn-pestana', 'data-activa': pestana === 'productos' ? '1' : '0', onClick: () => this.setState({ pestana: 'productos', aviso: '' }) }, 'Productos'),
          h('button', { key: 'k', type: 'button', className: 'pn-pestana', 'data-activa': pestana === 'categorias' ? '1' : '0', onClick: () => this.setState({ pestana: 'categorias', aviso: '' }) }, 'Categorías'),
          h('button', { key: 'c', type: 'button', className: 'pn-pestana', 'data-activa': pestana === 'config' ? '1' : '0', onClick: () => this.setState({ pestana: 'config', aviso: '' }) }, 'Configuración')
        ])),

      aviso ? h('div', { key: 'av', className: 'pn-aviso' }, h('p', null, aviso)) : null,

      h('main', { key: 'm', className: 'pn-main' },
        trabajando && !this.state.productos.length
          ? h('p', { className: 'pn-vacio' }, 'Cargando…')
          : (pestana === 'productos' ? this.vistaProductos()
            : pestana === 'categorias' ? this.vistaCategorias()
            : this.vistaConfig()))
    ]);
  }

  renderVals() {
    if (this.state.arrancando) {
      return { contenido: h('p', { style: { padding: '40px 24px', color: BODY } }, 'Cargando…') };
    }
    return {
      contenido: h('div', { key: 'raiz' }, [
        this.state.sesion ? this.vistaPanel() : this.vistaAcceso(),
        this.vistaDialogo()
      ])
    };
  }
}
</script>
</body>
</html>
